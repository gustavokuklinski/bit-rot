<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Rot | Live Wiki & Database</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">☣</span>
                    <span class="brand-title">BIT ROT WIKI</span>
                </div>
                <button id="btn-reload" class="btn btn-secondary btn-sm" title="Reload from GitHub">🔄 Reload</button>
            </div>

            <!-- Repository Live Connection Header -->
            <div class="repo-banner">
                <div class="repo-info">
                    <span class="repo-label">Source:</span>
                    <a href="https://github.com/gustavokuklinski/bit-rot/tree/main/bitrot/data.rot/lib/data" target="_blank" class="repo-link">
                        gustavokuklinski/bit-rot
                    </a>
                </div>
                <div id="load-progress-container" class="progress-bar-container">
                    <div id="load-progress-bar" class="progress-bar"></div>
                    <span id="load-progress-text" class="progress-text">Initializing...</span>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search items, weapons, crafts..." autocomplete="off">
                <button id="clear-search" class="clear-btn">&times;</button>
            </div>

            <div class="filter-tabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="item">Items</button>
                <button class="tab" data-filter="cloth">Clothes</button>
                <button class="tab" data-filter="recipe">Crafts</button>
            </div>

            <div class="nav-tree" id="nav-list">
                <!-- Dynamically populated from GitHub repository XMLs -->
            </div>
            
            <div class="sidebar-footer">
                <span id="stat-counter">Connecting to repository...</span>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <main id="content">
            <header id="top-bar">
                <div id="breadcrumbs">
                    <span class="crumb" onclick="window.location.hash=''">Home</span>
                    <span class="crumb-separator">&rsaquo;</span>
                    <span id="active-crumb">Overview</span>
                </div>
                <div id="connection-status" class="status-badge status-disconnected">Connecting...</div>
            </header>

            <div id="wiki-viewport">
                <!-- Dynamic Content or Loading Indicator -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
