<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit Rot | GitHub Pages Wiki</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">☣</span>
                    <span class="brand-title">BIT ROT WIKI</span>
                </div>
            </div>

            <!-- GitHub Pages Repository Fetch Bar -->
            <div class="gh-fetch-bar">
                <div class="input-group">
                    <label for="gh-repo-input">Repository (owner/repo):</label>
                    <div class="row">
                        <input type="text" id="gh-repo-input" placeholder="username/repository">
                        <button id="btn-gh-fetch" class="btn btn-primary btn-sm">Fetch</button>
                    </div>
                </div>
                <div id="load-progress-container" class="progress-bar-container" style="display: none;">
                    <div id="load-progress-bar" class="progress-bar"></div>
                    <span id="load-progress-text" class="progress-text">0%</span>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search database..." autocomplete="off">
                <button id="clear-search" class="clear-btn">&times;</button>
            </div>

            <div class="filter-tabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="item">Items</button>
                <button class="tab" data-filter="cloth">Clothes</button>
                <button class="tab" data-filter="recipe">Crafts</button>
            </div>

            <div class="nav-tree" id="nav-list">
                <!-- Dynamically populated from scanned XML files -->
            </div>
            
            <div class="sidebar-footer">
                <span id="stat-counter">Connecting to GitHub...</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main id="content">
            <header id="top-bar">
                <div id="breadcrumbs">
                    <span class="crumb" onclick="window.location.hash=''">Home</span>
                    <span class="crumb-separator">&rsaquo;</span>
                    <span id="active-crumb">Overview</span>
                </div>
                <div id="connection-status" class="status-badge status-disconnected">Ready</div>
            </header>

            <div id="wiki-viewport">
                <!-- Dynamic content -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
