name: Bit Rot - Linux - AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache wget libfuse2
          # Install appimagetool globally so build.sh can find it
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Build AppImage
        run: |
          # Make sure the build script is executable
          chmod +x scripts/build.sh
          # Generate the .AppImage using your build script
          ./scripts/build.sh --appimage
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitrot-linux-appimage
          path: "*.AppImage"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.AppImage"
          generate_release_notes: true