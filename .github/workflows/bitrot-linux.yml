name: Bit Rot - Linux

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache zip

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          nuitka --onefile \
          --assume-yes-for-downloads \
          --output-dir=./build \
          --output-filename=bitrot.bin \
          --static-libpython=yes \
          --include-data-dir=bitrot/data.rot=data.rot \
          bitrot/bitrot.py

      - name: Package Game
        run: |
          # 1. Create the distribution folder
          mkdir -p bitrot_linux

          # 2. Ensure the binary is executable
          chmod +x build/bitrot.bin

          # 3. Copy the single binary into the distribution folder
          cp build/bitrot.bin bitrot_linux/

          # 4. Zip the folder for GitHub Releases
          cd bitrot_linux && zip -r ../bitrot_linux.zip . && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitrot-linux
          path: bitrot_linux/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bitrot_linux.zip
          generate_release_notes: true