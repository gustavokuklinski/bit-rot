name: Bit Rot - Linux

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache zip

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          nuitka --standalone \
          --assume-yes-for-downloads \
          --output-dir=./build \
          --static-libpython=yes \
          --include-data-dir=bitrot/data.rot=data.rot \
          bitrot/bitrot.py

      - name: Package Game
        run: |
          # 1. Create the directory
          mkdir -p bitrot_linux
          # 2. Copy the compiled files and data into that directory
          cp -r build/bitrot.dist/* bitrot_linux/
          cp -r bitrot/data.rot bitrot_linux/
          # 3. Create a zip file of the folder for the GitHub Release
          cd bitrot_linux && zip -r ../bitrot_linux.zip . && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitrot-linux
          # We upload the FOLDER. GitHub zips it once. No double-zip.
          path: bitrot_linux/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # We upload the ZIP we created in the "Package Game" step.
          files: bitrot_linux.zip
          generate_release_notes: true