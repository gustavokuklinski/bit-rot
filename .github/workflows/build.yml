name: Bit Rot Release

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0, v0.5-beta
  workflow_dispatch: # Allows manual trigger for testing

permissions:
  contents: write # Required to create releases

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            executable_ext: .exe
            asset_name: Windows_Build
            nuitka_flags: --windows-console-mode=disable --windows-icon-from-ico=./game/icons/favicon.ico
          
          - os: ubuntu-latest
            executable_ext: .bin
            asset_name: Linux_Build
            nuitka_flags: 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache

      - name: Install Python Dependencies
        run: |
          pip install nuitka
          # pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          nuitka --onefile --assume-yes-for-downloads --output-dir=./build ${{ matrix.nuitka_flags }} main.py

      - name: Prepare Staging Directory
        shell: bash
        run: |
          mkdir release
          cp -r game release/game
          mv build/main${{ matrix.executable_ext }} release/game_executable${{ matrix.executable_ext }}

      - name: Zip Release (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path release\* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Zip Release (Linux)
        if: runner.os == 'Linux'
        run: |
          cd release
          zip -r ../${{ matrix.asset_name }}.zip .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build # Waits for the build job to finish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Only runs if a tag was pushed
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip # Grabs all zips from the build job
          generate_release_notes: true