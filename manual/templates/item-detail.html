<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ITEM_NAME}} - Bit Rot Manual</title>
    <link rel="stylesheet" href="../templates/style.css">
</head>
<body>
    <div class="wiki-container">
        <aside class="wiki-sidebar">
            <div class="sidebar-logo">
                <a href="../index.html"><img src="../templates/assets/logo.png" alt="Bit Rot" /></a>
            </div>
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-link">🏠 Main Menu</a>
                <a href="../items.html" class="nav-link">📦 Items</a>
                <a href="../clothes.html" class="nav-link">👕 Clothes</a>
                <a href="../vehicles.html" class="nav-link">🚗 Vehicles</a>
                <a href="../crafts.html" class="nav-link">🔨 Crafting</a>
            </nav>
        </aside>

        <main class="wiki-content">
            <a href="javascript:history.back()" class="back-link">← Back</a>
            <header>
                <h1>Item Details</h1>
                <p style="color: var(--accent-secondary); margin-top: 10px;">{{ITEM_NAME}}</p>
            </header>

            <div class="detail-container">
                <div class="detail-sprite">
                    <img src="../{{SPRITE_PATH}}/{{SPRITE}}" alt="{{ITEM_NAME}}" onerror="this.style.display='none'">
                    <p style="margin-top: 15px; color: var(--text-secondary); font-size: 0.9em;">{{SPRITE}}</p>
                </div>
                
                <div class="detail-info">
                    <h2>{{ITEM_NAME}}</h2>
                    <span class="detail-type">{{ITEM_TYPE}}</span>
                    
                    <div class="detail-stats">
                        <h3>Properties</h3>
                        {{STATS_ROWS}}
                    </div>
                    
                    <div class="detail-stats">
                        <h3>Spawn Information</h3>
                        <div class="stat-row">
                            <span class="label">Spawn Chance</span>
                            <span class="value {{SPAWN_CLASS}}">{{SPAWN_TEXT}}</span>
                        </div>
                    </div>
                </div>

                {{CRAFTS_USING}}
                {{USED_IN_CRAFTS}}
            </div>
        </main>
    </div>
</body>
</html>
